<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'"><title>点译 · 网页总结</title><link rel="stylesheet" href="ui/summary.css"><script src="vendor/summary-renderers.js" defer></script><script type="module" src="ui/summary.js"></script></head><body>
<header class="source-section">
  <h1 id="source-title">网页总结</h1>
  <div class="source-meta"><p id="source-detail">当前标签页</p><span id="summary-status" role="status" aria-live="polite">正在准备总结…</span></div>
  <details id="summary-details" hidden><summary>来源与详情</summary><a id="source-link" target="_blank" rel="noopener noreferrer" hidden>打开原网页</a><p id="source-model"></p></details>
</header>
<div class="output-toolbar">
  <nav class="output-tabs" aria-label="总结显示方式" hidden>
    <button type="button" data-view="content" aria-label="总结内容" aria-pressed="true">正文</button>
    <button type="button" data-view="artifacts" aria-pressed="false">制品 <span id="artifact-count">0</span></button>
  </nav>
  <button type="button" id="summary-stop" hidden>停止</button>
  <button type="button" id="summary-retry" hidden>重新总结</button>
</div>
<main id="summary-scroller" tabindex="0" aria-label="总结内容滚动区">
  <p class="scope-note" id="scope-note" hidden></p>
  <div class="summary-message" id="summary-message"></div>
  <article class="summary-doc" id="summary-doc" aria-label="总结结果"></article>
</main>
<button type="button" id="new-output" hidden>有新内容 · 回到底部</button>
<footer class="output-footer"><span id="output-note">仅基于当前网页</span><div><button type="button" id="copy-summary" disabled>复制全文</button><button type="button" id="export-summary" aria-controls="export-menu" disabled>导出</button></div></footer>
<div id="notice" role="status" aria-live="polite" hidden></div>
<div id="export-menu" popover aria-label="选择导出格式"></div>
</body></html>
